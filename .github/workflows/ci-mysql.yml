name: CI-MySQL

on: [ push, pull_request ]

jobs:
  build-and-test:

    name: ${{ matrix.os }} (${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        configuration: [ Debug, Release ]
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    services:
      mysql:
        image: ${{ matrix.os == 'ubuntu-latest' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: test_ormppdb
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup MySQL
        if: runner.os != 'Linux'
        uses: ankane/setup-mysql@v1
        with:
          mysql-version: 8.0
          database: test_ormppdb

      - name: Configure cmake
        run : cmake -B${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DENABLE_MYSQL=ON

      - name: Build
        run : cmake --build ${{ github.workspace }}/build --config ${{ matrix.configuration }}

      - name: Test
        working-directory: ${{ github.workspace }}/build
        env :
          CTEST_OUTPUT_ON_FAILURE: 1
        run : ctest -C ${{ matrix.configuration }} -j 1 -V
